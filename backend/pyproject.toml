[project]
name = "ai-risk-manager-backend"
version = "0.1.0"
description = "Core backend services, ML inference engines, and agent orchestration for AI Risk Manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis[hiredis]>=5.0.8",
    "aiokafka>=0.11.0",
    "celery[redis]>=5.4.0",
    "onnxruntime>=1.18.1",
    "lightgbm>=4.4.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=1.0.8",
    "google-generativeai>=0.7.2",
    "qdrant-client>=1.10.1",
    "shap>=0.45.1",
    "scikit-learn>=1.5.1",
    "skl2onnx>=1.16.0",
    "torch>=2.0.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "fastavro>=1.9.5",
    "great-expectations>=0.18.19",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "langfuse>=2.43.1",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.155",
    "jinja2>=3.1.4",
    "neo4j>=5.23.0",
    "faust-streaming>=0.11.1",
    "rocksdict>=0.3.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.7",
    "mypy>=1.11.1",
    "factory-boy>=3.3.0",
    "faker>=27.0.0",
    "types-redis>=4.6.0.20240425",
    "types-boto3>=1.34.155",
    "types-passlib>=1.7.7.20240327",
    "types-python-jose>=3.3.4.20240106",
]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore:.*google.generativeai.*:FutureWarning",
    "ignore:.*Qdrant client version.*:UserWarning"
]
